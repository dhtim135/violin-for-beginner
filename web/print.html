<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="$assets/style.css" />
    <script src="$assets/abcjs.js"></script>
  </head>
  <body class="printdoc">
    <h1></h1>
    <p id="source"></p>
    <div class="legend" aria-label="Violin fingering guide">
      <span><strong>G · D · A · E</strong> Open strings</span>
      <span><strong>1–4</strong> Fingers</span>
      <span><strong>↓</strong> Low finger</span>
      <span><strong>↑</strong> High finger</span>
      <span><strong>Range?</strong> Outside first position</span>
    </div>
    <p class="bow-guide" id="bowGuide" hidden>⊓ Down bow · ∨ Up bow · A slur groups notes in one bow. Bowing includes practice suggestions.</p>
    <div id="score"></div>
    <p id="notices"></p>
    <section id="cardPage" hidden><h2>Practice card · 指法与弓法</h2><p id="cardTitle"></p><div id="cardContent" class="practice-content"></div></section>
    <script type="module">
      import { bowPlan } from "$assets/bowing.js";
      import { renderCard } from "$assets/practice-card.js";
      import { renderScore } from "$assets/music.js";
      import { songTitle } from "$assets/title.js";
      import { keyLabel } from "$assets/keys.js";
      window.printScore = (score) => {
        document.querySelector("h1").replaceChildren(songTitle(score));
        document.querySelector("#source").textContent = [
          "Source: " + score.source,
          score.part,
          score.key && "Playing in " + keyLabel(score.key),
          score.bpm + " BPM",
        ]
          .filter(Boolean)
          .join(" · ");
        document.querySelector("#notices").textContent =
          score.notices.join(" ");
        const options = score.printOptions || {};
        const bows = bowPlan(score);
        document.querySelector("#bowGuide").hidden = !options.bows;
        renderScore(score, document.querySelector("#score"), () => {}, 1, options.bows ? bows : null);
        document.querySelector("#cardPage").hidden = !options.card;
        if (options.card) {
          document.querySelector("#cardTitle").replaceChildren(songTitle(score), " · " + keyLabel(score.key));
          renderCard(document.querySelector("#cardContent"), score, bows, Math.max(0, Math.min(score.bars.length, Math.trunc(options.bar) || 1) - 1), options.scale);
        }
      };
    </script>
  </body>
</html>
